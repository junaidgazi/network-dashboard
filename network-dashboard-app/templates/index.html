<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Network Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e5e7eb;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }

  .summary {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1;
  }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .label { font-size: 13px; color: #9ca3af; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #2a2e37;
    font-size: 14px;
  }
  th { color: #9ca3af; font-weight: 600; font-size: 12px; text-transform: uppercase; }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
  }
  .online .status-dot { background: #22c55e; }
  .offline .status-dot { background: #4b5563; }
  .online { color: #22c55e; }
  .offline { color: #6b7280; }

  .ip { color: #9ca3af; font-family: monospace; }
  .updated { color: #6b7280; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>

  <h1>Home Network Dashboard</h1>
  <div class="subtitle">Devices seen on your network, refreshing automatically</div>

  <div class="summary">
    <div class="card">
      <div class="value" id="onlineCount">-</div>
      <div class="label">Online now</div>
    </div>
    <div class="card">
      <div class="value" id="totalCount">-</div>
      <div class="label">Total devices seen</div>
    </div>
    <div class="card">
      <div class="value" id="yourIp">-</div>
      <div class="label">Your IP address</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Device</th>
        <th>IP Address</th>
        <th>Last Seen Online</th>
      </tr>
    </thead>
    <tbody id="deviceRows"></tbody>
  </table>

  <div class="updated" id="lastUpdated"></div>

<script>
// This runs in the browser. Every 5 seconds it asks our Flask API
// "what's the current status?" and rewrites the table with fresh data.

async function refreshDashboard() {
  try {
    const [summaryRes, devicesRes] = await Promise.all([
      fetch('/api/summary'),
      fetch('/api/devices')
    ]);
    const summary = await summaryRes.json();
    const devices = await devicesRes.json();

    document.getElementById('onlineCount').textContent = summary.online_now;
    document.getElementById('totalCount').textContent = summary.total_known_devices;
    document.getElementById('yourIp').textContent = summary.your_ip;

    const rows = devices.map(d => {
      const name = d.hostname || '(unknown device)';
      const lastSeen = d.last_seen ? new Date(d.last_seen).toLocaleString() : '-';
      return `
        <tr class="${d.status}">
          <td class="${d.status}"><span class="status-dot"></span>${d.status}</td>
          <td>${name}</td>
          <td class="ip">${d.ip}</td>
          <td>${lastSeen}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('deviceRows').innerHTML = rows || '<tr><td colspan="4">No devices found yet - scanning...</td></tr>';
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('lastUpdated').textContent = 'Connection error - is the server running?';
  }
}

refreshDashboard();
setInterval(refreshDashboard, 5000); // refresh every 5 seconds
</script>

</body>
</html>
